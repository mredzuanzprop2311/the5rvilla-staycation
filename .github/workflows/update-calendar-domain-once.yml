name: Update calendar domain links once
on:
  push:
    branches: [main]
    paths: [.github/workflows/update-calendar-domain-once.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace the two calendar links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          original = p.read_bytes()
          old = b"https://the5rvilla-calendar-v2.pages.dev"
          new = b"https://calendar.the5rvilla.com"
          assert original.count(old) == 2, "Expected exactly two calendar links"
          updated = original.replace(old, new)
          assert updated.replace(new, old) == original, "Unexpected changes"
          p.write_bytes(updated)
          PY
      - name: Save updated links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use calendar.the5rvilla.com for both calendar buttons"
          git push origin HEAD:main

<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE 5R VILLA — Admin Promo Cloud</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f3f6fb;color:#111827}.wrap{max-width:820px;margin:auto;padding:14px}.top{display:flex;gap:10px;justify-content:space-between;align-items:center;margin:6px 0 12px}.top a{text-decoration:none;color:#0f172a;font-weight:900;background:#fff;border:1px solid #dbe3ee;padding:10px 13px;border-radius:999px}.hero{background:#0f172a;color:#fff;border-radius:20px;padding:20px;margin-bottom:14px}.hero h1{margin:0 0 5px;font-size:clamp(26px,6vw,38px)}.hero p{margin:0;color:#cbd5e1}.box{background:#fff;border:1px solid #dbe3ee;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 8px 28px rgba(15,23,42,.06)}.auth{background:#fffbeb;border-color:#fde68a}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-weight:800;font-size:14px;display:block}input,select,textarea{width:100%;margin-top:6px;border:1px solid #cbd5e1;border-radius:12px;padding:12px;font-size:16px;background:#fff;min-height:48px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:900;font-size:15px;cursor:pointer;min-height:48px}.primary{background:#0f172a;color:#fff}.amber{background:#f59e0b;color:#111827}.light{background:#fff;border:1px solid #cbd5e1}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.status{margin-top:10px;border-radius:12px;padding:10px 12px;font-weight:800;display:none}.ok{display:block;background:#dcfce7;color:#166534;border:1px solid #86efac}.err{display:block;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}.info{display:block;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}.current{display:grid;grid-template-columns:1fr 1fr;gap:10px}.price{padding:14px;border-radius:14px;background:#0f172a;color:#fff}.price b{display:block;font-size:30px;margin-top:4px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-weight:900;font-size:12px;background:#dcfce7;color:#166534}.badge.off{background:#f1f5f9;color:#475569}@media(max-width:640px){.wrap{padding:10px}.row,.current{grid-template-columns:1fr}.box{padding:14px}.hero{padding:18px}.actions .btn{width:100%}}
</style></head><body><main class="wrap">
<div class="top"><strong>🏡 THE 5R VILLA</strong><div><a href="/owner/">Owner</a> <a href="/">Website</a></div></div>
<section class="hero"><h1>💰 Admin Promo Cloud</h1><p>Harga hanya dianggap berjaya selepas data disimpan dan dibaca semula dari Firestore.</p></section>
<section class="box auth"><h2 style="margin-top:0">🔐 Login Admin</h2><div id="loggedOut"><input id="email" type="email" autocomplete="username" placeholder="Email Admin"><input id="password" type="password" autocomplete="current-password" placeholder="Password Admin"><div class="actions"><button id="login" class="btn primary">LOGIN ADMIN</button><button id="reset" class="btn light">RESET PASSWORD</button></div></div><div id="loggedIn" style="display:none"><div id="who" style="font-weight:900;color:#166534"></div><div class="actions"><button id="logout" class="btn light">Logout</button></div></div><div id="authStatus" class="status"></div></section>
<section class="box"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2 style="margin:0">Harga Semasa Cloud</h2><span id="promoBadge" class="badge off">MEMUAT...</span></div><div class="current" style="margin-top:12px"><div class="price">Weekday<b id="currentWeekday">—</b></div><div class="price">Weekend / Holiday<b id="currentWeekend">—</b></div></div><div id="cloudStatus" class="status info">Menyambung ke Firestore...</div></section>
<section class="box"><h2 style="margin-top:0">Ubah Harga</h2><form id="form"><div class="row"><label>Harga Asal Weekday (RM)<input id="weekdayRegular" type="number" min="0" step="1" value="700" required></label><label>Harga Asal Weekend (RM)<input id="weekendRegular" type="number" min="0" step="1" value="800" required></label><label>Harga Promo Weekday (RM)<input id="weekdayPromo" type="number" min="0" step="1" value="650" required></label><label>Harga Promo Weekend (RM)<input id="weekendPromo" type="number" min="0" step="1" value="750" required></label><label>Promosi<select id="promoEnabled"><option value="true">ON — Papar harga promo</option><option value="false">OFF — Papar harga asal</option></select></label><label>Tarikh Tamat Promo (optional)<input id="promoEnd" type="date"></label><label class="full">Tajuk Promosi<input id="promoTitle" value="Promosi THE 5R VILLA"></label><label class="full">Nota Promosi<textarea id="promoNote" rows="3">Harga promosi tertakluk kepada tarikh dan kekosongan.</textarea></label></div><div class="actions"><button id="save" class="btn amber" type="submit" disabled>💾 SIMPAN KE CLOUD</button><a class="btn light" style="text-decoration:none;text-align:center" href="/#pricing" target="_blank">👁️ Lihat Website</a></div><div id="saveStatus" class="status"></div></form></section>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getFirestore,doc,onSnapshot,setDoc,getDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut,sendPasswordResetEmail,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
const cfg={apiKey:"AIzaSyCFL1cy0n6GrzAXRh8prnyOiaLKBUUXkzM",authDomain:"the-5r-villa-v2.firebaseapp.com",projectId:"the-5r-villa-v2",storageBucket:"the-5r-villa-v2.firebasestorage.app",messagingSenderId:"907809196867",appId:"1:907809196867:web:b030f3636e6dcef3f83df6",measurementId:"G-0BH80KPN87"};
const ADMIN_UID="BPTDvhc0GDTou8bfInKmb4ZRfSF2";
const app=initializeApp(cfg,"promoCloudPage");const db=getFirestore(app);const auth=getAuth(app);setPersistence(auth,browserLocalPersistence).catch(()=>{});const ref=doc(db,"websiteSettings","pricing");
const $=id=>document.getElementById(id);let lastCloud=null;
function setStatus(id,msg,type='info'){const e=$(id);e.textContent=msg;e.className='status '+type;e.style.display='block'}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function active(d){if(!d?.promoEnabled)return false;if(!d.promoEnd)return true;return String(d.promoEnd)>=todayISO()}
function apply(d){d={weekdayRegular:700,weekendRegular:800,weekdayPromo:650,weekendPromo:750,promoEnabled:false,promoEnd:'',promoTitle:'Promosi THE 5R VILLA',promoNote:'Harga promosi tertakluk kepada tarikh dan kekosongan.',...(d||{})};lastCloud=d;const on=active(d);$('currentWeekday').textContent='RM'+Number(on?d.weekdayPromo:d.weekdayRegular).toFixed(0);$('currentWeekend').textContent='RM'+Number(on?d.weekendPromo:d.weekendRegular).toFixed(0);$('promoBadge').textContent=on?'PROMO ON':'PROMO OFF';$('promoBadge').className='badge'+(on?'':' off');$('weekdayRegular').value=d.weekdayRegular;$('weekendRegular').value=d.weekendRegular;$('weekdayPromo').value=d.weekdayPromo;$('weekendPromo').value=d.weekendPromo;$('promoEnabled').value=d.promoEnabled?'true':'false';$('promoEnd').value=d.promoEnd||'';$('promoTitle').value=d.promoTitle||'';$('promoNote').value=d.promoNote||'';setStatus('cloudStatus','✅ Data Firestore diterima. Harga semasa di atas ialah data cloud.','ok')}
onSnapshot(ref,s=>{if(s.exists())apply(s.data());else{apply(null);setStatus('cloudStatus','⚠️ Dokumen pricing belum wujud. Login dan tekan Simpan untuk cipta.','info')}},e=>setStatus('cloudStatus','❌ Gagal baca Firestore: '+(e.code||e.message),'err'));
onAuthStateChanged(auth,u=>{const ok=!!u&&u.uid===ADMIN_UID;$('loggedOut').style.display=u?'none':'block';$('loggedIn').style.display=u?'block':'none';$('save').disabled=!ok;if(u){$('who').textContent=ok?'✅ LOGIN BERJAYA — '+u.email:'❌ UID akaun ini bukan admin yang dibenarkan';setStatus('authStatus',ok?'Admin disahkan. Butang Simpan Cloud sudah aktif.':'Akaun login tetapi UID tidak dibenarkan.',ok?'ok':'err')}else setStatus('authStatus','Belum login. Login dahulu untuk simpan harga.','info')});
$('login').onclick=async()=>{try{setStatus('authStatus','Sedang login...','info');const u=await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);if(u.user.uid!==ADMIN_UID)throw new Error('UID akaun tidak sepadan dengan Admin THE 5R VILLA.');setStatus('authStatus','✅ Login berjaya.','ok')}catch(e){let m=e.code||e.message;if(String(m).includes('unauthorized-domain'))m='Domain website belum dibenarkan dalam Firebase Authentication > Settings > Authorized domains.';setStatus('authStatus','❌ Login gagal: '+m,'err')}};
$('logout').onclick=()=>signOut(auth);
$('reset').onclick=async()=>{try{await sendPasswordResetEmail(auth,$('email').value.trim());setStatus('authStatus','✅ Email reset password telah dihantar.','ok')}catch(e){setStatus('authStatus','❌ Reset gagal: '+(e.code||e.message),'err')}};
$('form').addEventListener('submit',async ev=>{ev.preventDefault();if(!auth.currentUser||auth.currentUser.uid!==ADMIN_UID){setStatus('saveStatus','❌ Belum login sebagai admin yang dibenarkan.','err');return}const data={weekdayRegular:Number($('weekdayRegular').value),weekendRegular:Number($('weekendRegular').value),weekdayPromo:Number($('weekdayPromo').value),weekendPromo:Number($('weekendPromo').value),promoEnabled:$('promoEnabled').value==='true',promoEnd:$('promoEnd').value||'',promoTitle:$('promoTitle').value.trim()||'Promosi THE 5R VILLA',promoNote:$('promoNote').value.trim()||'Harga promosi tertakluk kepada tarikh dan kekosongan.',updatedAt:serverTimestamp()};try{$('save').disabled=true;setStatus('saveStatus','Menyimpan ke Firestore dan membuat semakan semula...','info');await setDoc(ref,data,{merge:true});const verify=await getDoc(ref);if(!verify.exists())throw new Error('Dokumen pricing tidak dapat dibaca semula selepas simpan.');const v=verify.data();const same=Number(v.weekdayRegular)===data.weekdayRegular&&Number(v.weekendRegular)===data.weekendRegular&&Number(v.weekdayPromo)===data.weekdayPromo&&Number(v.weekendPromo)===data.weekendPromo&&Boolean(v.promoEnabled)===data.promoEnabled&&String(v.promoEnd||'')===data.promoEnd;if(!same)throw new Error('Data cloud tidak sepadan selepas verifikasi.');apply(v);setStatus('saveStatus','✅ BERJAYA: Harga sudah disimpan & disahkan dari Firestore Cloud. Buka Guest Website untuk lihat perubahan.','ok')}catch(e){setStatus('saveStatus','❌ Gagal simpan cloud: '+(e.code||e.message),'err')}finally{$('save').disabled=!(auth.currentUser&&auth.currentUser.uid===ADMIN_UID)}});
</script></body></html>
